id = "vjeantet.mission-control"
name = "Mission Control"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Tiled overview of every pane in the current workspace"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/fetch-or-build.sh"]

[[actions]]
id = "open"
title = "Open Mission Control"
contexts = ["workspace"]
command = ["sh", "scripts/open.sh"]

[[panes]]
id = "mission-control"
title = "Mission Control"
placement = "popup"
width = "100%"
height = "100%"
command = ["./target/release/herdr-mission-control"]
